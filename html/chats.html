
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/chats.css">
    <link rel="icon" href="/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <title>Chats | NexTeams</title>
</head>
<body>
    <main class="container">
         <aside class="sidebar">
        </aside>
        
        
<main class="content" >



        <header class="header">
        <h1>Chats Pages</h1> <button class="logout" id="logout">Logout</button>
        <div class="header-notification-icons">
        <img src="../img/notification.png" alt="Notification logo"/>
        <span class="notification-count">3</span>
        <div class="notification">
        <p>You have 3 new notifications</p>
        <ul>
        <li>New message from Alice</li>
        <li>Project deadline approaching</li>
        <li>Team meeting at 3 PM</li>
        </ul>
        </div>
        </div> 
        </header>
        <div class="loading" id="loading">
        <div class="inner-cirle"></div>
        <p>Loading Messages</p>
        </div>
        <main class="chats-content">
        <section class="chat-list" id="chat-list-section">
        <h2>Chats</h2>
        <ul id="chat-list">


        </ul>
        <h2>Channels</h2>
        <ul id="channel-list">

        </section>
        <section class="message-window" id="message-window" >
        <header>
        <img id="chat-profile" src="../img/defaultuser.png" alt="User profile"/>
        <h2 id="chat-name"></h2>
        <span id="chat-status">Online</span>
        </header>
        <div class="messages" id="message-grid">

        </div> 
        <div class="chat-input">
        <input id="chat-input-text" type="text"  placeholder="Type a message...">
        <button onclick="sendMessages()">Send</button>
        </div>
        </section>


        <footer class="footer">
     <p>&copy; 2026 Puvith kumar. All rights reserved.</p>

</footer>
</main>





</main>
    </main>
</body>
<script src="/script.js"></script>
<script src="/js/chats.js"></script>
</html>
